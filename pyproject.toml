[project]
authors = [{ email = "contact@linkup.so", name = "Linkup" }]
classifiers = [
  "Framework :: Pydantic",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
description = "Linkup web search, sourced answers and page fetching for Pydantic AI agents"
keywords = ["agents", "ai", "linkup", "llm", "pydantic", "pydantic-ai", "search", "web-search"]
license = "MIT"
name = "pydantic-ai-linkup"
readme = "README.md"
requires-python = ">=3.10,<4.0"
version = "0.1.0"

dependencies = ["httpx>=0.23.0", "linkup-sdk>=0.23.0", "pydantic-ai-slim>=2.0.0"]

[dependency-groups]
dev = [
  "mypy",
  "prek>=0.3.5",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-socket",
  "ruff",
]

[project.urls]
Documentation = "https://github.com/LinkupPlatform/pydantic-ai-linkup#readme"
Homepage = "https://www.linkup.so"
Repository = "https://github.com/LinkupPlatform/pydantic-ai-linkup"
Source = "https://github.com/LinkupPlatform/pydantic-ai-linkup"
Tracker = "https://github.com/LinkupPlatform/pydantic-ai-linkup/issues"

[tool.mypy]
exclude = ['^tests/']
strict = true

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.coverage.report]
exclude_also = ["raise TypeError", "raise ValueError"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "S", # flake8-bandit
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["S101"] # Use of assert detected

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_linkup"]

[tool.uv]
exclude-newer = "2 weeks" # Reduce risks of supply chain attacks
